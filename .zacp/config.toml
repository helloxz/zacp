# ZACP 配置文件
# 详细配置说明请参考 backend/configs/config.example.toml

[server]
addr = ":8680"
mode = "debug"   # debug | release

[session]
default_cwd = "."          # Agent 默认工作目录
auto_approve = false       # 生产环境建议 false，开发调试可设为 true

[database]
# 数据库路径，相对于 $ZACP_HOME
path = "data/zacp.db"

