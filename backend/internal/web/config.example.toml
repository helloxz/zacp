# zacp 运行时配置样例
# 复制为 ~/.zacp/config.toml 并按需修改
# 密钥/Token 不要写在这里，用环境变量注入

[server]
# 监听地址（IP:PORT；":8680" 表示监听所有网卡）。
# 优先级：--addr 命令行 > ZACP_ADDR 环境变量 > 本配置 > 默认 :8680
addr = ":8680"
# debug | release。
# 优先级：GIN_MODE 环境变量（显式设置时）> 本配置 > 默认 debug
mode = "release"

[session]
# Agent 默认工作目录（不是 $ZACP_DATA，是代码项目路径）
default_cwd = "."
# 开发模式可设为 true 自动批准所有权限请求；生产环境必须 false，暂时无实际作用
auto_approve = false
# 空闲回收：agent 超过该时长无活跃操作即被停止释放内存（下次使用时自动重启）
# 0 表示禁用空闲回收；格式为 Go duration（如 "30m"、"1h"）
idle_timeout = "30m"

[database]
# 相对路径相对于 $ZACP_DATA（默认 ~/.zacp）
# 默认 data/zacp.db，即 ~/.zacp/data/zacp.db
path = "data/zacp.db"

# 单用户账号认证（可选）
# 默认不写该段 = 无需登录即可访问（password_hash 为空 = 认证关闭，老用户零影响）。
# 推荐在设置页「用户设置」中设置用户名与密码（自动写回本段，热生效无需重启）；
# 也可手动编辑：密码哈希格式 "sha256$<hex>"（sha256("zacp"+密码) 的 hex），
# 可用命令生成：python3 -c "import hashlib;print('sha256$'+hashlib.sha256(b'zacp'+input().encode()).hexdigest())"
# 忘记密码时：删除这两行（或置空）即恢复免登录，再重新设置即可。
# [auth]
# username = ""
# password_hash = ""

# 多 Agent 配置：每个二进制/ACP 入口一条
# 前端可查看所有 enabled 的 agent 并切换

# [[agents]]
# id = "reasonix"
# name = "Reasonix"
# enabled = true
# transport = "stdio"
# 或绝对路径，也可设 REASONIX_BIN 环境变量
# command = "reasonix"
# args = ["--acp"]
# 空则用 session.default_cwd
# cwd = ""

# 示例：Pi Agent（默认禁用）
# [[agents]]
# id = "pi"
# name = "Pi Agent"
# enabled = false
# transport = "stdio"
# command = "pi"
# args = ["--acp"]
# cwd = ""

# 示例：Grok（默认禁用）
# [[agents]]
# id = "grok"
# name = "Grok"
# enabled = false
# transport = "stdio"
# command = "grok"
# args = ["--acp"]
# cwd = ""
