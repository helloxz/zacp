<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zacp</title>
    <script>
      // 防闪白：Vue 挂载前按本地偏好设置主题（key 与 stores/app.ts 保持一致）
      // Tailwind 依赖 .dark class，incremark markdown 依赖 data-theme 属性，二者都要同步
      ;(function () {
        try {
          var dark = localStorage.getItem('zacp.themeMode') === 'dark'
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          /* localStorage 不可用时保持默认浅色 */
        }
      })()
    </script>
    <style>
      /* 首屏 loading：Vue 挂载前展示，避免打包产物较大、加载慢时用户看到白屏误以为失败而关闭页面。
         挂载后 #app 非空，纯 CSS 相邻兄弟选择器自动隐藏，无需额外 JS。 */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f8fafc; /* 浅色主题 surface（与 src/styles/main.css 保持一致） */
        color: #64748b; /* slate-500 */
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.25s;
      }
      /* 暗色主题：head 内脚本已在挂载前设置 html.dark，此处直接跟随 */
      html.dark #app-loading {
        background: #0f172a; /* slate-900 */
        color: #94a3b8; /* slate-400 */
      }
      /* 转圈动画：圆环 spinner，浅/暗色各适配一套边框色 */
      #app-loading .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(100, 116, 139, 0.2);
        border-top-color: #0ea5e9; /* 主题 primary */
        animation: zacp-spin 0.8s linear infinite;
      }
      html.dark #app-loading .spinner {
        border-color: rgba(148, 163, 184, 0.2);
        border-top-color: #38bdf8; /* 暗色主题 primary */
      }
      @keyframes zacp-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Vue 挂载完成后（#app 非空）隐藏 loading */
      #app:not(:empty) + #app-loading {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
